[package]
name = "omnizip-mount-nfs"
description = "OmniZip mount backend for macOS: archives as volumes through a loopback NFSv3 server and the system's mount_nfs (docs/12-mount.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
omnizip-vfs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
omnizip-core.workspace = true
nfsserve = { version = "0.11", default-features = false }
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time"] }
libc = "0.2"
unicode-normalization.workspace = true
tracing.workspace = true

[dev-dependencies]
omnizip-core.workspace = true
omnizip-formats.workspace = true
tempfile.workspace = true
