[package]
name = "omnizip-shell-win"
description = "OmniZip Windows Explorer context menu (IExplorerCommand COM server) and per-user registration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "omnizip_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
omnizip-core.workspace = true
omnizip-i18n.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-registry = "0.100"
