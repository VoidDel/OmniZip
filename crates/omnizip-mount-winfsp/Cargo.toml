[package]
name = "omnizip-mount-winfsp"
description = "OmniZip mount backend for Windows: archives as read-only drives through WinFsp (docs/12-mount.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
omnizip-vfs.workspace = true

[target.'cfg(windows)'.dependencies]
tracing.workspace = true
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[dev-dependencies]
omnizip-core.workspace = true
omnizip-formats.workspace = true
tempfile.workspace = true
