[package]
name = "omnizip-mountd"
description = "OmniZip mount daemon: hosts a user's mounted archives, so that they stay mounted after OmniZip exits (docs/12-mount.md §4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
omnizip-core.workspace = true
omnizip-formats.workspace = true
omnizip-i18n.workspace = true
omnizip-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
omnizip-mount-winfsp.workspace = true
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
omnizip-core.workspace = true
omnizip-formats.workspace = true
tempfile.workspace = true
