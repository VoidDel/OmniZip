# Pull requests and main (docs/10-build-release.md §4).
# lint ──► test (Windows, macOS, Linux) ──► bundle-smoke (Windows installers, unsigned)
#
# Kept cheap: documentation-only changes do not run it, a newer push cancels the run in
# progress, every job has a time limit, only main saves build caches, and the installers are
# kept for a day.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", LICENSE]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", LICENSE]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in test builds: faster to compile, and much smaller caches.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Translations complete in every language
        run: pnpm i18n-check
      - name: TypeScript
        run: pnpm lint
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
      # The desktop crate embeds the built frontend, so build it before clippy.
      - run: pnpm --filter omnizip-desktop build
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter omnizip-desktop build
      - name: Rust tests (core, engines, CLI, mount core, shell, desktop)
        run: cargo test --workspace
      - name: Frontend tests
        run: pnpm test
      # The parsers are platform independent (and fuzzed nightly on Linux), so one OS is enough.
      - name: Fuzz drivers on mutated archives (stable smoke run)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path fuzz/Cargo.toml --lib

  bundle-smoke:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: NSIS installer (builds the CLI and the shell DLL through prepare-bundle)
        run: pnpm bundle:windows
      - name: MSIX package (unsigned)
        shell: pwsh
        run: platform/windows/msix/pack.ps1 -Version 0.0.0-ci
      # Pull requests only check that packaging works; main and manual runs keep the installers
      # for a day to download and try.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msix/*.msix
          retention-days: 1
