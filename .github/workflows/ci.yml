# Pull requests and main (docs/10-build-release.md §4).
# lint ──► test (Windows, macOS, Linux) ──► bundle-smoke (Windows installers, unsigned)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Translations complete in every language
        run: pnpm i18n-check
      - name: TypeScript
        run: pnpm lint
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
      # The desktop crate embeds the built frontend, so build it before clippy.
      - run: pnpm --filter omnizip-desktop build
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter omnizip-desktop build
      - name: Rust tests (core, engines, CLI, mount core, shell, desktop)
        run: cargo test --workspace
      - name: Frontend tests
        run: pnpm test
      - name: Fuzz drivers on mutated archives (stable smoke run)
        run: cargo test --manifest-path fuzz/Cargo.toml --lib

  bundle-smoke:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: NSIS installer (builds the CLI and the shell DLL through prepare-bundle)
        run: pnpm --filter omnizip-desktop tauri build --bundles nsis
      - name: MSIX package (unsigned)
        shell: pwsh
        run: platform/windows/msix/pack.ps1 -Version 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msix/*.msix
          retention-days: 7
