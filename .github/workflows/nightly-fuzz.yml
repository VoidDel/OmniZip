# Nightly fuzzing of every parser (docs/10-build-release.md §4, §7).
# Each target runs for an hour; the corpus carries over between nights through the cache.
# A crash uploads the reproducer and opens an issue.
# A scheduled night without new commits on main is skipped (it would fuzz the same code again),
# and only the newest corpus of each target is kept.
name: Nightly fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "3600"

permissions:
  contents: read
  issues: write

jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits on main since the last night: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [detect, zip, sevenz, tar, rar, readonly, mount, sanitize, encoding]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed corpus from fixtures
        if: matrix.target == 'rar' || matrix.target == 'detect'
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fixtures/rar/*.rar fuzz/corpus/${{ matrix.target }}/
      - name: Seed corpus from fixtures (read-only formats)
        if: matrix.target == 'readonly'
        # Each fixture behind the byte that picks its parser (FORMATS in fuzz_targets/readonly.rs).
        run: |
          mkdir -p fuzz/corpus/readonly
          byte() { python3 -c "import sys; sys.stdout.buffer.write(bytes([$1]))"; }
          seed() { for f in $2; do { byte "$1"; cat "$f"; } > "fuzz/corpus/readonly/$1-$(basename "$f")"; done; }
          seed 0 "fixtures/ar/*"
          seed 1 "fixtures/deb/*"
          seed 2 "fixtures/cpio/*"
          seed 4 "fixtures/iso/*"
          seed 5 "fixtures/xar/*"
          seed 6 "fixtures/cab/*.cab"
          seed 7 "fixtures/lzh/*.lzh"
          seed 8 "fixtures/arj/*.arj"
      # Debug assertions and overflow checks on (-a): an overflow on hostile input is a bug.
      - name: Fuzz
        run: >
          cargo +nightly fuzz run -a ${{ matrix.target }} --
          -max_total_time=${{ inputs.seconds || 3600 }}
          -timeout=30 -rss_limit_mb=2048
      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "fuzz: crash in ${{ matrix.target }} ($(date -u +%F))" \
            --body "The nightly fuzz run found a crash in \`${{ matrix.target }}\`. Reproducer: artifact \`fuzz-crash-${{ matrix.target }}\` of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Reproduce with \`cargo +nightly fuzz run -a ${{ matrix.target }} <file>\`."

  # Each night saves a new corpus per target (the cache key carries the run id); drop the older
  # ones so that the caches do not pile up towards the repository limit.
  prune-corpus:
    needs: fuzz
    if: always() && needs.fuzz.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the newest corpus of each target
        run: |
          for t in detect zip sevenz tar rar mount sanitize encoding; do
            gh cache list --key "fuzz-corpus-$t-" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
              xargs -r -n1 gh cache delete
          done
