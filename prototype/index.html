<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniZip 交互原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局概念：桌面背景上的单一应用窗口；材质侧栏贯穿全高，右侧为标题栏 + 命令栏 + 内容 + 状态栏。
   颜色全部来自设计令牌（docs/05），默认浅色 = 晨光 Aurora，默认深色 = 午夜 Midnight；运行时由 JS 重写。 */
:root{
  --bg-canvas:#F5F7FB; --bg-surface:#FFFFFF; --bg-elevated:#FFFFFF; --bg-sidebar:#EEF2F8; --sidebar-material:rgba(238,242,248,.72);
  --bg-subtle:#F0F2F6; --bg-hover:#E9ECF2; --bg-pressed:#DFE3EB;
  --fg-primary:#1B2230; --fg-secondary:#5B6577; --fg-muted:rgba(27,34,48,.55); --fg-disabled:rgba(27,34,48,.35);
  --border-subtle:#EDF0F5; --border-default:#DCE2EC; --border-strong:#B9C2D1; --border-focus:#2F6FED;
  --accent:#2F6FED; --accent-hover:#2A62D1; --accent-pressed:#2556B6; --accent-subtle:rgba(47,111,237,.14); --accent-fg:#FFFFFF;
  --success:#1E9E63; --success-subtle:rgba(30,158,99,.14); --warning:#D98A0B; --warning-subtle:rgba(217,138,11,.16);
  --danger:#D8434E; --danger-subtle:rgba(216,67,78,.14); --info:#2A8CD6; --info-subtle:rgba(42,140,214,.14);
  --selection-bg:rgba(47,111,237,.22); --selection-fg:#1B2230; --folder-color:#E0A82E;
  --shadow-1:0 2px 8px rgba(20,30,50,.10); --shadow-2:0 16px 48px rgba(20,30,50,.18); --overlay-scrim:rgba(10,14,22,.4);
  --desktop:radial-gradient(1100px 700px at 15% 10%,#cfe0ff 0%,transparent 60%),radial-gradient(900px 600px at 90% 95%,#ffd6e6 0%,transparent 60%),#e6ecf6;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --row-h:32px; --ctrl-h:32px; --dur:160ms; --size-base:14px; --sidebar-w:240px;
  --font-ui:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC","Noto Sans",sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg-canvas:#0F1115; --bg-surface:#161922; --bg-elevated:#1C2029; --bg-sidebar:#12151C; --sidebar-material:rgba(18,21,28,.78);
  --bg-subtle:#1E212A; --bg-hover:#252730; --bg-pressed:#2D3038;
  --fg-primary:#E6E8EE; --fg-secondary:#A3A9B7; --fg-muted:rgba(230,232,238,.55); --fg-disabled:rgba(230,232,238,.35);
  --border-subtle:#202431; --border-default:#2A3040; --border-strong:#595E6B; --border-focus:#5B8CFF;
  --accent:#5B8CFF; --accent-hover:#6C97FD; --accent-pressed:#7AA0FB; --accent-subtle:rgba(91,140,255,.14); --accent-fg:#FFFFFF;
  --success:#3DD68C; --success-subtle:rgba(61,214,140,.14); --warning:#F5B544; --warning-subtle:rgba(245,181,68,.16);
  --danger:#FF6B6B; --danger-subtle:rgba(255,107,107,.14); --info:#58B7FF; --info-subtle:rgba(88,183,255,.14);
  --selection-bg:rgba(91,140,255,.22); --selection-fg:#E6E8EE; --folder-color:#F0C35C;
  --shadow-1:0 2px 8px rgba(0,0,0,.45); --shadow-2:0 16px 48px rgba(0,0,0,.6); --overlay-scrim:rgba(0,0,0,.55);
  --desktop:radial-gradient(1100px 700px at 15% 10%,#1d2a4a 0%,transparent 60%),radial-gradient(900px 600px at 90% 95%,#3a1f3d 0%,transparent 60%),#0b0e15;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg-canvas:#0F1115; --bg-surface:#161922; --bg-elevated:#1C2029; --bg-sidebar:#12151C; --sidebar-material:rgba(18,21,28,.78);
  --bg-subtle:#1E212A; --bg-hover:#252730; --bg-pressed:#2D3038;
  --fg-primary:#E6E8EE; --fg-secondary:#A3A9B7; --fg-muted:rgba(230,232,238,.55); --fg-disabled:rgba(230,232,238,.35);
  --border-subtle:#202431; --border-default:#2A3040; --border-strong:#595E6B; --border-focus:#5B8CFF;
  --accent:#5B8CFF; --accent-hover:#6C97FD; --accent-pressed:#7AA0FB; --accent-subtle:rgba(91,140,255,.14); --accent-fg:#FFFFFF;
  --success:#3DD68C; --success-subtle:rgba(61,214,140,.14); --warning:#F5B544; --warning-subtle:rgba(245,181,68,.16);
  --danger:#FF6B6B; --danger-subtle:rgba(255,107,107,.14); --info:#58B7FF; --info-subtle:rgba(88,183,255,.14);
  --selection-bg:rgba(91,140,255,.22); --selection-fg:#E6E8EE; --folder-color:#F0C35C;
  --shadow-1:0 2px 8px rgba(0,0,0,.45); --shadow-2:0 16px 48px rgba(0,0,0,.6); --overlay-scrim:rgba(0,0,0,.55);
  --desktop:radial-gradient(1100px 700px at 15% 10%,#1d2a4a 0%,transparent 60%),radial-gradient(900px 600px at 90% 95%,#3a1f3d 0%,transparent 60%),#0b0e15;
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{font-size:var(--size-base)}
body{margin:0;background:var(--desktop);color:var(--fg-primary);font-family:var(--font-ui);font-size:1rem;line-height:1.45;display:flex;flex-direction:column;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:start}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:var(--radius-sm)}
.ic{flex:none;width:18px;height:18px}
kbd{font-family:var(--font-mono);font-size:.78rem;color:var(--fg-muted)}
.mono{font-family:var(--font-mono)}
.grow{flex:1;min-width:0}

/* 原型控制条 */
.protobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:40px;padding:6px 12px;border-radius:var(--radius-lg);background:var(--sidebar-material);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-subtle);font-size:.86rem;flex:none}
.protobar .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.protobar .brand small{font-weight:400;color:var(--fg-secondary)}
.protobar .hint{color:var(--fg-muted);font-size:.78rem}
.seg{display:inline-flex;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;color:var(--fg-secondary);font-size:.86rem;display:inline-flex;align-items:center;gap:6px;transition:background var(--dur),color var(--dur);white-space:nowrap}
.seg button:hover{color:var(--fg-primary)}
.seg button[aria-pressed="true"]{background:var(--bg-surface);color:var(--fg-primary);box-shadow:var(--shadow-1)}
.seg.lg button{height:30px;padding:0 14px;font-size:.9rem}

/* 窗口 */
.window{position:relative;flex:1;min-height:0;width:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-2);border:1px solid var(--border-subtle);transition:grid-template-columns var(--dur)}
.window[data-platform="win"]{border-radius:8px}
.window.collapsed{--sidebar-w:52px}
.window[data-platform="mac"].collapsed{--sidebar-w:96px}
.sidebar{background:var(--sidebar-material);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.window.no-material .sidebar,.window.no-material .protobar{backdrop-filter:none;-webkit-backdrop-filter:none}
.window.no-material .sidebar{background:var(--bg-sidebar)}
.sb-top{height:40px;display:flex;align-items:center;padding:0 10px 0 14px;gap:8px;flex:none}
.sb-top .brandname{font-weight:600;font-size:.93rem;white-space:nowrap}
.logo{width:22px;height:22px;flex:none}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.sb-nav{padding:4px 8px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--radius-md);color:var(--fg-primary);width:100%;font-size:.93rem;white-space:nowrap;overflow:hidden;transition:background var(--dur)}
.nav-item:hover{background:var(--bg-hover)}
.nav-item[aria-current="true"]{background:var(--accent-subtle);color:var(--accent)}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis}
.sb-label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);padding:12px 18px 4px;white-space:nowrap;flex:none}
.tree{flex:1;overflow:auto;padding:0 8px 8px;min-height:40px}
.tree-item{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px;border-radius:6px;font-size:.9rem;width:100%;white-space:nowrap;color:var(--fg-primary)}
.tree-item .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-muted);flex:none;border-radius:4px}
.tree-item .tw:hover{background:var(--bg-pressed)}
.tree-item .tw .ic{width:14px;height:14px}
.tree-item .lbl{overflow:hidden;text-overflow:ellipsis}
.tree-item:hover{background:var(--bg-hover)}
.tree-item[aria-current="true"]{background:var(--accent-subtle);color:var(--accent)}
.sb-bottom{border-top:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;gap:2px;flex:none}
.mount-row{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:6px;font-size:.86rem;white-space:nowrap}
.mount-row .pt{font-family:var(--font-mono);color:var(--fg-secondary);font-size:.78rem;overflow:hidden;text-overflow:ellipsis}
.mount-row .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.mount-row .iconbtn{width:24px;height:24px}
.task-sum{display:flex;flex-direction:column;gap:6px;padding:6px 10px;border-radius:var(--radius-md);width:100%;font-size:.86rem}
.task-sum:hover{background:var(--bg-hover)}
.task-sum .row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.task-sum .row span{overflow:hidden;text-overflow:ellipsis}
.progress{height:4px;background:var(--bg-pressed);border-radius:2px;overflow:hidden;width:100%}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width 200ms linear}
.window.collapsed .lbl,.window.collapsed .sb-label,.window.collapsed .tree,.window.collapsed .brandname,.window.collapsed .task-sum .progress,.window.collapsed .mount-row .pt,.window.collapsed .mount-row .nm{display:none}
.window.collapsed .nav-item,.window.collapsed .mount-row{justify-content:center;padding:0}
.window.collapsed .sb-top{justify-content:center;padding:0;gap:4px}

/* 主列 */
.maincol{display:flex;flex-direction:column;min-width:0;background:var(--bg-canvas)}
.titlebar{height:40px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;flex:none}
.titlebar .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--fg-secondary);overflow:hidden;white-space:nowrap}
.titlebar .ttl b{color:var(--fg-primary);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.window[data-platform="mac"] .titlebar .ttl{justify-content:center}
.winctl{display:flex;margin-left:4px}
.winctl button{width:46px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-secondary);border-radius:0}
.winctl button .ic{width:14px;height:14px}
.winctl button:hover{background:var(--bg-hover);color:var(--fg-primary)}
.winctl .close:hover{background:#e81123;color:#fff}
.window[data-platform="linux"] .winctl{gap:8px;margin-right:6px}
.window[data-platform="linux"] .winctl button{width:26px;height:26px;border-radius:50%;background:var(--bg-subtle)}
.window[data-platform="linux"] .winctl .close:hover{background:var(--bg-pressed);color:var(--fg-primary)}
.window[data-platform="mac"] .winctl{display:none}
.searchbox{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 10px;border-radius:var(--radius-md);background:var(--bg-surface);border:1px solid var(--border-default);width:min(300px,38vw);transition:border-color var(--dur),box-shadow var(--dur)}
.searchbox input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:.9rem}
.searchbox input::placeholder{color:var(--fg-muted)}
.searchbox:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-subtle)}
.searchbox .ic{color:var(--fg-muted);width:16px;height:16px}
.iconbtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--fg-secondary);transition:background var(--dur),color var(--dur);flex:none}
.iconbtn:hover{background:var(--bg-hover);color:var(--fg-primary)}
.iconbtn[aria-pressed="true"]{background:var(--accent-subtle);color:var(--accent)}
.iconbtn:disabled{color:var(--fg-disabled);background:none;cursor:default}
.iconbtn.sm{width:28px;height:28px}
.cmdbar{height:48px;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--border-subtle);flex:none;overflow:hidden}
.btn{height:var(--ctrl-h);padding:0 12px;border-radius:var(--radius-md);display:inline-flex;align-items:center;gap:8px;font-size:.93rem;font-weight:500;color:var(--fg-primary);border:1px solid transparent;transition:background var(--dur),border-color var(--dur),color var(--dur),box-shadow var(--dur);white-space:nowrap;flex:none}
.btn:hover{background:var(--bg-hover)}
.btn:active{background:var(--bg-pressed)}
.btn:disabled{color:var(--fg-disabled);cursor:default;background:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:active{background:var(--accent-pressed)}
.btn.outline{border-color:var(--border-default);background:var(--bg-surface)}
.btn.outline:hover{background:var(--bg-hover)}
.btn.lg{height:40px;padding:0 18px;font-size:.95rem}
.btn .ic{width:16px;height:16px}
.crumbs{height:32px;display:flex;align-items:center;gap:2px;padding:0 16px;font-size:.86rem;color:var(--fg-secondary);flex:none;overflow:hidden;white-space:nowrap}
.crumbs button{height:24px;padding:0 6px;border-radius:4px;color:inherit;display:inline-flex;align-items:center;gap:6px;flex:none}
.crumbs button:hover{background:var(--bg-hover);color:var(--fg-primary)}
.crumbs .cur{color:var(--fg-primary);font-weight:500}
.crumbs .sep{color:var(--fg-muted);padding:0 2px}
.crumbs .badge{margin-left:4px}
.content{flex:1;min-height:0;overflow:auto;position:relative;outline:0}
.statusbar{height:28px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:.8rem;color:var(--fg-secondary);border-top:1px solid var(--border-subtle);flex:none;white-space:nowrap;overflow:hidden}
.statusbar .mid{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;min-width:0}
.statusbar .lft,.statusbar .rgt{display:flex;align-items:center;gap:8px;flex:none}
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--badge-fg);background:var(--badge-bg);white-space:nowrap}
.dot{width:4px;height:4px;border-radius:50%;background:var(--fg-muted);display:inline-block}

/* 列表 */
.thead,.trow{display:grid;grid-template-columns:minmax(200px,1fr) 96px 96px 150px 88px;align-items:center;column-gap:12px}
.thead{position:sticky;top:0;z-index:2;height:30px;background:var(--bg-canvas);border-bottom:1px solid var(--border-subtle);font-size:.78rem;color:var(--fg-secondary);font-weight:500;padding:0 26px 0 26px;margin:0}
.thead button{display:inline-flex;align-items:center;gap:4px;color:inherit;height:100%;width:100%;white-space:nowrap;overflow:hidden}
.thead button:hover{color:var(--fg-primary)}
.thead button .ic{width:12px;height:12px;opacity:0;transition:opacity var(--dur)}
.thead button[aria-sort]:not([aria-sort="none"]) .ic{opacity:1}
.thead .num,.trow .num{text-align:end;justify-content:flex-end;font-variant-numeric:tabular-nums}
.rows{padding:4px 10px 12px}
.trow{height:var(--row-h);border-radius:6px;cursor:default;font-size:.93rem;user-select:none;padding:0 16px;transition:background 80ms}
.trow.srch{height:auto;min-height:var(--row-h);padding-block:5px}
.trow:hover{background:var(--bg-hover)}
.trow[aria-selected="true"]{background:var(--selection-bg);color:var(--selection-fg)}
.trow.focus{box-shadow:inset 0 0 0 1px var(--accent)}
.trow .nm{display:flex;align-items:center;gap:10px;min-width:0}
.trow .nm-txt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.trow .nm-txt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sub{font-size:.76rem;color:var(--fg-muted);font-family:var(--font-mono)}
.trow .dim{color:var(--fg-secondary);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .marks{display:inline-flex;color:var(--warning);margin-left:2px}
.trow .marks .ic{width:14px;height:14px}
.fi{width:20px;height:20px;color:var(--fg-secondary);flex:none}
.fi.folder{color:var(--folder-color)}
.window[data-icons="duotone"] .fi.image{color:#D4587A}
.window[data-icons="duotone"] .fi.code{color:#4F8BE0}
.window[data-icons="duotone"] .fi.text{color:#6E8597}
.window[data-icons="duotone"] .fi.video{color:#9B59B6}
.window[data-icons="duotone"] .fi.archive{color:#C98A2E}
.window[data-icons="duotone"] .fi.font{color:#2E9E8F}
.window[data-icons="mono"] .fi{color:var(--fg-secondary)}
.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px;padding:12px 16px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 10px;border-radius:var(--radius-md);text-align:center;font-size:.86rem;cursor:default;user-select:none;min-width:0}
.gcell .fi{width:44px;height:44px}
.gcell span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell small{color:var(--fg-muted);font-size:.74rem}
.gcell:hover{background:var(--bg-hover)}
.gcell[aria-selected="true"]{background:var(--selection-bg)}
.gcell.focus{box-shadow:inset 0 0 0 1px var(--accent)}
.emptyst{min-height:60%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg-muted);padding:32px;text-align:center}
.emptyst .ic{width:40px;height:40px;opacity:.6}
@media (max-width:980px){.thead,.trow{grid-template-columns:minmax(160px,1fr) 90px 150px}.col-packed,.col-type{display:none}}
@media (max-width:600px){.thead,.trow{grid-template-columns:minmax(120px,1fr) 80px}.col-mtime{display:none}}

/* 开始页 */
.home{padding:32px 24px;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bg-surface);transition:border-color var(--dur),background var(--dur)}
.drop.over{border-color:var(--accent);background:var(--accent-subtle)}
.drop .ic{width:36px;height:36px;color:var(--accent)}
.drop h2{margin:0;font-size:1.25rem;font-weight:600;text-wrap:balance}
.drop p{margin:0;color:var(--fg-secondary);font-size:.9rem}
.home .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.home .sect{display:flex;align-items:baseline;justify-content:space-between}
.home h3{margin:0;font-size:.95rem;font-weight:600}
.home .sect button{color:var(--fg-secondary);font-size:.86rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--radius-md);background:var(--bg-surface);border:1px solid var(--border-subtle);transition:border-color var(--dur),box-shadow var(--dur);min-width:0}
.card:hover{border-color:var(--border-default);box-shadow:var(--shadow-1)}
.card .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--badge-bg);color:var(--badge-fg);flex:none;font-size:.72rem;font-weight:800;letter-spacing:.04em}
.card .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.card .meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.93rem}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;min-height:52px;border-top:1px solid var(--border-subtle)}

.set-row .lab{display:flex;flex-direction:column;gap:2px;min-width:0}

.set-row .ctl{display:flex;align-items:center;gap:8px;flex:none;max-width:60%;justify-content:flex-end;flex-wrap:wrap}
.set-row.col{flex-direction:column;align-items:stretch}
.set-row.col .ctl{max-width:none;justify-content:flex-start}
.set-row .status{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;color:var(--success)}
.set-row .status.warn{color:var(--warning)}
select.sel,input.inp{height:var(--ctrl-h);padding:0 10px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--bg-surface);font-size:.9rem;min-width:0;max-width:100%}
select.sel:focus,input.inp:focus{outline:0;border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-subtle)}
input.inp.mono{font-family:var(--font-mono);font-size:.84rem}
.switch{width:38px;height:22px;border-radius:11px;background:var(--bg-pressed);position:relative;transition:background var(--dur);flex:none;border:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform var(--dur)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;width:100%}
.tcard{border:2px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-surface);transition:border-color var(--dur);min-width:0}
.tcard:hover{border-color:var(--border-strong)}
.tcard[aria-pressed="true"]{border-color:var(--accent)}
.tcard .prev{height:70px;display:grid;grid-template-columns:34% 1fr}
.tcard .prev .ps{display:flex;flex-direction:column;gap:5px;padding:8px 6px}
.tcard .prev .ps i{height:5px;border-radius:2px;display:block;opacity:.75}
.tcard .prev .pm{padding:8px;display:flex;flex-direction:column;gap:5px}
.tcard .prev .pm i{height:6px;border-radius:3px;display:block}
.tcard .tn{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;font-size:.86rem}
.tcard .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .tn small{color:var(--fg-muted);font-size:.74rem;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;position:relative;flex:none}
.sw[aria-pressed="true"]{border-color:var(--fg-primary)}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid var(--bg-surface)}
.sw.custom{background:conic-gradient(#f66,#fc6,#6f6,#6cf,#66f,#f6f,#f66)}
input[type=range]{accent-color:var(--accent);width:160px}
input[type=color]{width:28px;height:28px;border:1px solid var(--border-default);border-radius:50%;padding:0;background:none}
.menu-prev{border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-elevated);box-shadow:var(--shadow-1);padding:4px;width:min(100%,300px);font-size:.9rem}
.menu-prev div{padding:6px 10px;border-radius:4px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.menu-prev div.hl{background:var(--bg-hover)}
.menu-prev div.sub{padding-left:28px;color:var(--fg-secondary)}
.menu-prev hr{border:0;border-top:1px solid var(--border-subtle);margin:4px 0}
.fmt-table{width:100%;border-collapse:collapse;font-size:.9rem}
.fmt-table td{padding:8px 16px;border-top:1px solid var(--border-subtle)}
.fmt-table tr:first-child td{border-top:0}
.fmt-table td:last-child{text-align:end}
.about-logo{display:flex;align-items:center;gap:16px}
.about-logo .logo{width:56px;height:56px}
.about-logo b{font-size:1.4rem;font-weight:700}
.about-logo span{color:var(--fg-secondary);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--bg-subtle);font-size:.8rem;color:var(--fg-secondary);font-family:var(--font-mono)}
@media (max-width:720px){.settings{grid-template-columns:1fr;grid-template-rows:auto 1fr}.set-nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--border-subtle)}.set-nav .nav-item{width:auto;flex:none}.set-body{padding:16px}.set-row .ctl{max-width:50%}}

/* 浮层：模态 / 侧滑 / 抽屉 / 菜单 / 提示 */
#overlays{display:contents}
.scrim{position:absolute;inset:0;background:var(--overlay-scrim);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;animation:fade var(--dur) ease-out}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.radios{display:flex;gap:4px;flex-wrap:wrap}
.pw{display:flex;align-items:center;gap:6px;border:1px solid var(--border-default);border-radius:var(--radius-md);height:var(--ctrl-h);padding:0 4px 0 10px;background:var(--bg-surface);flex:1;min-width:140px}

.pw input{border:0;outline:0;background:none;flex:1;min-width:0}
.strength{display:flex;gap:3px;align-items:center}
.strength i{width:16px;height:4px;border-radius:2px;background:var(--bg-pressed)}
.strength i.on{background:var(--success)}
.strength i.on.w{background:var(--warning)}
.hint{font-size:.8rem;color:var(--fg-secondary)}
.err{font-size:.84rem;color:var(--danger);display:flex;align-items:center;gap:6px}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-md);background:var(--info-subtle);color:var(--fg-primary);font-size:.86rem;line-height:1.4}
.note .ic{color:var(--info);margin-top:1px}
.note.warn{background:var(--warning-subtle)}
.note.warn .ic{color:var(--warning)}
details.adv summary{cursor:pointer;font-size:.9rem;color:var(--fg-secondary);list-style:none;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary .ic{width:14px;height:14px;transition:transform var(--dur)}
details.adv[open] summary .ic{transform:rotate(90deg)}
details.adv summary .hint{margin-left:4px}
details.adv .advbody{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.levels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--fg-muted);padding:0 2px}
.est{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--fg-secondary);font-variant-numeric:tabular-nums}
.est b{color:var(--fg-primary);font-weight:600}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.conf .side{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.86rem;background:var(--bg-surface)}
.conf .side h4{margin:0;font-size:.8rem;color:var(--fg-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.conf .side b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conf .side .ic{width:28px;height:28px}
.conf .side .new{color:var(--success)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9rem}
.dl dt{color:var(--fg-secondary);margin:0}
.dl dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl dd.mono{font-size:.84rem}
.code{margin:0;font-family:var(--font-mono);font-size:.82rem;line-height:1.55;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 14px;overflow:auto;max-height:50vh;white-space:pre;color:var(--fg-primary)}
.imgprev{border-radius:var(--radius-md);overflow:hidden;background:var(--bg-subtle);display:flex;align-items:center;justify-content:center}
.imgprev svg{width:100%;height:auto;display:block}
.prev-meta{display:flex;gap:12px;font-size:.8rem;color:var(--fg-secondary);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(100%,380px);background:var(--bg-elevated);border-left:1px solid var(--border-subtle);box-shadow:var(--shadow-2);z-index:25;display:flex;flex-direction:column;animation:slide 220ms ease-out}
.drawer header{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border-subtle);flex:none}
.drawer header h2{margin:0;font-size:1rem;font-weight:600;flex:1}
.drawer .list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.task{padding:10px 12px;border-radius:var(--radius-md);background:var(--bg-surface);border:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.task .tt{display:flex;align-items:center;gap:8px}
.task .tt .ic{color:var(--fg-secondary)}
.task .tt b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.task .tt .iconbtn{width:26px;height:26px}
.task .meta{display:flex;justify-content:space-between;color:var(--fg-secondary);font-variant-numeric:tabular-nums;gap:8px}
.task .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.task.cancelled .progress>i{background:var(--fg-disabled)}
.task.paused .progress>i{background:var(--warning)}
.task .acts{display:flex;gap:6px;justify-content:flex-end}
.task .acts .btn{height:26px;padding:0 8px;font-size:.82rem}
.ctx{position:absolute;z-index:40;min-width:208px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:4px;font-size:.9rem;animation:pop 120ms ease-out}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 10px;border-radius:4px;color:var(--fg-primary);white-space:nowrap}
.ctx button .ic{width:16px;height:16px;color:var(--fg-secondary)}
.ctx button:hover{background:var(--bg-hover)}

.ctx button.danger{color:var(--danger)}

.ctx hr{border:0;border-top:1px solid var(--border-subtle);margin:4px 0}
.toasts{position:absolute;right:16px;bottom:40px;display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none;max-width:min(380px,calc(100% - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--bg-elevated);border:1px solid var(--border-default);box-shadow:var(--shadow-2);font-size:.9rem;animation:pop 180ms ease-out}

.toast.err>.ic{color:var(--danger)}
.toast.info>.ic{color:var(--info)}
.toast.warn>.ic{color:var(--warning)}
.toast span{flex:1;min-width:0}
.toast button.lnk{color:var(--accent);font-weight:500;white-space:nowrap}

.miniwin .acts .btn{height:28px;padding:0 10px;font-size:.84rem}
.sb-scrim{position:absolute;inset:0;z-index:19;background:var(--overlay-scrim)}
.menu-toggle{display:none}
@keyframes fade{from{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:720px){

  .searchbox{width:120px}
  .protobar .hint{display:none}
  .conf{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
}
</style>
</head>
<body>

</div>

/* ---------- 颜色工具 ---------- */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbToHex(a){return '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.map((v,i)=>v+(B[i]-v)*t));}
function alpha(h,a){const [r,g,b]=hexToRgb(h);return `rgba(${r},${g},${b},${a})`;}
function lum(h){const [r,g,b]=hexToRgb(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*r+0.7152*g+0.0722*b;}
function contrast(a,b){const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
function onColor(bg){return contrast(bg,'#FFFFFF')>=3?'#FFFFFF':'#111111';}

function sortNodes(arr){const {key,dir}=state.sort;let col;try{col=new Intl.Collator(state.lang,{numeric:true,sensitivity:'base'});}catch(e){col={compare:(a,b)=>a<b?-1:a>b?1:0};}
 arr.sort((a,b)=>{const ad=a.kind==='dir',bd=b.kind==='dir';if(ad!==bd)return ad?-1:1;let r=0;if(key==='size')r=stats(a).size-stats(b).size;else if(key==='packed')r=stats(a).packed-stats(b).packed;else if(key==='mtime')r=a.mtime-b.mtime;else if(key==='type')r=col.compare(typeOf(a),typeOf(b));else r=col.compare(a.name,b.name);if(r===0)r=col.compare(a.name,b.name);return r*dir;});return arr;}
function searchAll(rootNode,q){const out=[],ql=q.toLowerCase();(function walk(n){for(const c of n.children){if(out.length>=500)return;if(c.name.toLowerCase().includes(ql))out.push(c);if(c.kind==='dir')walk(c);}})(rootNode);return sortNodes(out);}

 const k=e.key.toLowerCase();
 if(mod&&k==='e'){e.preventDefault();openExtract(state.archive,selectionNodes());return;}
 if(mod&&k==='m'){e.preventDefault();openMount(state.archive);return;}
 if(mod&&k==='a'){e.preventDefault();selectAll();return;}
 if(mod&&k==='t'){e.preventDefault();command('test');return;}
 if(mod&&e.key==='1'){state.vm='table';renderCmdbar();renderContent();return;}
 if(mod&&e.key==='2'){state.vm='grid';renderCmdbar();renderContent();return;}
 if(mod)return;
 if(e.key==='ArrowDown'){e.preventDefault();moveFocus(state.vm==='grid'?gridCols():1,e);}
 else if(e.key==='ArrowUp'){e.preventDefault();moveFocus(state.vm==='grid'?-gridCols():-1,e);}
 else if(e.key==='ArrowRight'&&state.vm==='grid'){e.preventDefault();moveFocus(1,e);}
 else if(e.key==='ArrowLeft'&&state.vm==='grid'){e.preventDefault();moveFocus(-1,e);}
 else if(e.key==='Home'){e.preventDefault();moveFocus(-LIST.length,e);}
 else if(e.key==='End'){e.preventDefault();moveFocus(LIST.length,e);}
 else if(e.key==='Enter'){const n=NODES.get(state.focusId);if(n){if(e.altKey)openProps(n);else openNode(n);}}
 else if(e.key==='Backspace'){if(state.cwd.parent)navigate(state.cwd.parent);}
 else if(e.key==='Delete'){deleteNodes(selectionNodes());}
 else if(e.key==='F2'){const n=selectionNodes();if(n.length===1)openRename(n[0]);}
 else if(e.key===' '){e.preventDefault();const n=NODES.get(state.focusId);if(n&&n.kind!=='dir')openPreview(n);}
 else if(e.key.length===1&&!e.altKey){const start=LIST.findIndex(n=>n.id===state.focusId);for(let i=1;i<=LIST.length;i++){const n=LIST[(start+i)%LIST.length];if(n.name.toLowerCase().startsWith(k)){focusNode(n,false);break;}}}
});

/* ---------- 事件分发 ---------- */
document.addEventListener('click',e=>{
 if(state.ctx&&!e.target.closest('.ctx'))closeCtx();
 if(state.sbOpen&&!e.target.closest('#sidebar')&&!e.target.closest('.menu-toggle')){state.sbOpen=false;applyChrome();}
 const row=e.target.closest('.trow,.gcell');
 if(row&&!e.target.closest('[data-action]')){clickRow(+row.dataset.id,e);return;}
 const a=e.target.closest('[data-action]');if(!a)return;
 handle(a.dataset.action,a.dataset.val,a,e);
});
document.addEventListener('dblclick',e=>{const row=e.target.closest('.trow,.gcell');if(row){const n=NODES.get(+row.dataset.id);if(n)openNode(n);}});
document.addEventListener('contextmenu',e=>{const c=$('#content');if(!c||state.view!=='browser'||!c.contains(e.target))return;e.preventDefault();const row=e.target.closest('.trow,.gcell');
 if(row){const id=+row.dataset.id;if(!state.sel.has(id)){state.sel.clear();state.sel.add(id);state.focusId=id;state.anchorId=id;refreshSel();}rowMenu(e.clientX,e.clientY,NODES.get(id));}else bgMenu(e.clientX,e.clientY);});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.set){setPref(el.dataset.set,el.value);return;}
 if(el.dataset.pref){state.prefs[el.dataset.pref]=el.type==='range'?+el.value:el.value;if(el.type==='range')renderView();return;}
 if(el.dataset.assoc){state.prefs.assoc[el.dataset.assoc]=el.checked;return;}
 if(el.dataset.shellitem){state.prefs.shellItems[el.dataset.shellitem]=el.checked;renderView();}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.set==='fontScale'){state.fontScale=+el.value;applyTheme();const l=el.previousElementSibling;if(l)l.textContent=state.fontScale+'px';persist();}
 else if(el.dataset.set==='accent'&&el.type==='color'){state.accent=el.value;applyTheme();persist();}
 else if(el.dataset.pref==='cacheGB'){const l=el.previousElementSibling;if(l)l.textContent=el.value+' GB';}
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');openArchive('a2');toast(t('home.dropped'),{type:'info'});}});
function setPref(k,v){if(k==='material')state.material=v==='toggle'?!state.material:!!v;else if(k==='fontScale')state.fontScale=+v;else state[k]=v;persist();
 if(k==='lang'||k==='platform'||k==='sizeUnit')render();else{applyTheme();applyChrome();if(state.view==='settings')renderView();renderProtobar();renderTitlebar();renderStatus();}}
function toggleAppearance(){state.appearance=isDark()?'light':'dark';persist();render();}
function showSettings(tab){state.view='settings';if(tab)state.settingsTab=tab;state.sbOpen=false;render();}
function command(c,el){const a=state.archive,nodes=state.view==='browser'?selectionNodes():[];
 switch(c){
  case 'new':openCompress(nodes);break;
  case 'home-extract':openExtract(ARCHIVES[0]);break;
  case 'add':addFiles();break;
  case 'extract':openExtract(a,nodes);break;
  case 'mount':openMount(a);break;
  case 'test':startTask({kind:'test',name:a.name,files:filesOf([a.get()]),total:stats(a.get()).size});break;
  case 'delete':deleteNodes(nodes);break;
  case 'props':if(nodes[0])openProps(nodes[0]);break;
  case 'more':moreMenu(el);break;
  case 'clear-search':state.query='';renderTitlebar();renderContent();renderStatus();break;
 }}
function handle(act,val,el,e){
 switch(act){
  case 'nav':if(val==='settings')showSettings();else{state.view='home';state.sbOpen=false;render();if(val!=='home')setTimeout(()=>{const c=$('.cards');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});},60);}break;
  case 'open':openArchive(val);break;
  case 'tree':{const n=NODES.get(+val);if(n)navigate(n);break;}
  case 'expand':{e.stopPropagation();const id=+val;if(state.expanded.has(id))state.expanded.delete(id);else state.expanded.add(id);renderSidebar();break;}
  case 'crumb':{const n=NODES.get(+val);if(n&&(n!==state.cwd||state.query))navigate(n);break;}
  case 'hist':if(val==='up'){if(state.cwd.parent)navigate(state.cwd.parent);}else{const i=state.histIdx+(val==='back'?-1:1);if(i>=0&&i<state.hist.length){state.histIdx=i;navigate(state.hist[i],true);}}break;
  case 'sort':if(state.sort.key===val)state.sort.dir*=-1;else state.sort={key:val,dir:1};renderContent();break;
  case 'vm':state.vm=val;renderCmdbar();renderContent();break;
  case 'cmd':command(val,el);break;
  case 'toggle-sb':state.sbCollapsed=!state.sbCollapsed;persist();applyChrome();renderSidebar();break;
  case 'sb-open':state.sbOpen=!state.sbOpen;applyChrome();break;
  case 'theme-toggle':toggleAppearance();break;
  case 'tasks':state.drawer=true;renderDrawer();break;
  case 'drawer-close':state.drawer=false;renderDrawer();break;
  case 'tasks-clear':state.tasks=state.tasks.filter(x=>x.state==='running'||x.state==='paused');renderTasks();break;
  case 'task':{const [op,id]=val.split(':');const tk=state.tasks.find(x=>x.id===+id);if(!tk)break;if(op==='pause')tk.state='paused';else if(op==='resume'){tk.state='running';ensureTick();}else if(op==='cancel'){tk.state='cancelled';toast(t('toast.cancelled'),{type:'info'});if(tk.mini)state.miniTask=null;}renderTasks();break;}
  case 'mini-bg':state.miniTask=null;renderMini();toast(t('task.background'),{type:'info',ms:1500});break;
  case 'mount-eject':{const m=state.mounts.find(x=>x.id===val);if(m){state.mounts=state.mounts.filter(x=>x!==m);renderSidebar();renderStatus();if(state.view==='settings')renderView();toast(t('mount.ejected',esc(m.label)),{type:'info'});}break;}
  case 'settings-tab':state.settingsTab=val;renderView();break;
  case 'set':setPref(el.dataset.set,val);break;
  case 'set-appearance':state.appearance=val;persist();render();break;
  case 'set-accent':state.accent=val;persist();applyTheme();renderView();renderProtobar();break;
  case 'set-density':state.density=val;persist();applyChrome();renderView();break;
  case 'set-icons':state.iconStyle=val;persist();applyChrome();renderView();break;
  case 'set-shell':state.shellStyle=val;persist();renderView();break;
  case 'pref-toggle':state.prefs[val]=!state.prefs[val];renderView();break;
  case 'platform':state.platform=val;persist();render();break;
  case 'win-ctl':toast(t('toast.winctl'),{type:'info'});break;
  case 'toast':toast(t(val),{type:'info'});break;
  case 'shell-demo':shellDemo();break;
  case 'proto-reset':try{localStorage.removeItem('omnizip-proto');}catch(x){}location.reload();break;
 }}

/* ---------- 启动 ---------- */
function init(){
 if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',()=>{if(state.appearance==='system')render();});}
 if(window.MutationObserver)new MutationObserver(()=>{if(state.appearance==='system')render();}).observe(root,{attributes:true,attributeFilter:['data-theme']});
 render();
}
init();
})();
</script>
</body>
</html>
