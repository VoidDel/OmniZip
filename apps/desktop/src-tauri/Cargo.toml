[package]
name = "omnizip-desktop"
description = "OmniZip desktop application (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "omnizip_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "omnizip-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omnizip-core.workspace = true
omnizip-formats.workspace = true
omnizip-i18n.workspace = true
omnizip-vfs.workspace = true
omnizip-mountd.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
tempfile.workspace = true
tracing.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Management_Deployment",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
omnizip-shell-win = { path = "../../../crates/omnizip-shell-win" }
omnizip-mount-winfsp.workspace = true
